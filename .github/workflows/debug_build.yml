name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'img/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'img/**'

permissions:
  contents: write
  
jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
      with:
        submodules: false
        fetch-depth: 1
    - name: Validation
      uses: gradle/actions/wrapper-validation@v6.4.0

    - name: Java setup
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Restore cache
      uses: actions/cache@v6
      with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .git/modules
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '.gitmodules') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

    - name: Fetch submodules
      run: git submodule update --init --recursive --jobs 8 --depth 1

    - name: Build
      run: ./gradlew assembleDebug
    - name: Store app-universal-debug
      uses: actions/upload-artifact@v7
      with:
        name: glinux-universal-debug
        path: ./lorie-app/build/outputs/apk/standalone/debug/glinux-universal-debug.apk

    - name: Store sharedUid-debug APK
      uses: actions/upload-artifact@v7
      with:
        name: glinux-sharedUid-debug
        path: ./lorie-app/build/outputs/apk/sharedUid/debug/glinux-universal-sharedUid-debug.apk

    - name: Store companion package
      uses: actions/upload-artifact@v7
      with:
        name: termux-companion packages
        path: |
          ./shell-loader/build/outputs/companion/glinux-*-all.deb
          ./shell-loader/build/outputs/companion/glinux-*-any.pkg.tar.xz

    - name: Store unstripped libraries with debug symbols
      uses: actions/upload-artifact@v7
      with:
        name: glinux-unstripped-libraries-for-ndk-stack
        path: ./lorie/build/intermediates/cxx/Debug/*

    - name: Update Nightly Release
      uses: andelf/nightly-release@main
      if: github.repository == 'termux/glinux' && github.ref == 'refs/heads/master'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: nightly
        name: 'Nightly Release $$'
        draft: false
        prerelease: false
        body: |
          This is a nightly release of the glinux app.
          Based on ${{ github.sha }}
        files: |
          ./lorie-app/build/outputs/apk/standalone/debug/glinux-universal-debug.apk
          ./lorie-app/build/outputs/apk/sharedUid/debug/glinux-universal-sharedUid-debug.apk
          ./shell-loader/build/outputs/companion/glinux-*-all.deb
          ./shell-loader/build/outputs/companion/glinux-*-any.pkg.tar.xz
